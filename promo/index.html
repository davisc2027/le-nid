<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Nid Promo</title>
<!--
  Le Nid promo, a 44 s scene deck driven by one master clock.
  Every motion is a paused Web Animation; seek(t) sets them all to time t, so a frame grabber gets exact frames.
  ?t=12.5 freezes at 12.5 s. ?capture=1 hides the controls (render.mjs). Space plays/pauses, arrows scrub.
  Odile's drawing and keyframes are ported 1:1 from components/art/Stork.tsx, lib/odile-motion.ts and app/globals.css.
-->
<style>
@font-face { font-family: "Nunito"; src: url("fonts/nunito-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; }
@font-face { font-family: "EB Garamond"; src: url("fonts/eb-garamond-latin-400-italic.woff2") format("woff2"); font-style: italic; }
:root {
  --background: #fbf6ee; --surface: #ffffff; --foreground: #2b2118; --muted: #6e6257; --border: #e6dccd;
  --primary: #a8412e; --primary-fg: #ffffff; --accent: #e8892b; --accent-ink: #a65a0f; --tint: #f4e3dc; --good: #3f7d4e;
  --art-stone: #c98a74; --art-roof: #a8412e; --art-roof-2: #7e6a8f; --art-wall: #f1e2c8;
  --art-beam: #7a4f38; --art-window: #8fb0d6; --art-water: #9fbdd6; --art-glow: #f6c58a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #1b1612; overflow: hidden; }
body { font-family: "Nunito", system-ui, sans-serif; color: var(--foreground); }
#viewport { position: absolute; inset: 0; display: grid; place-items: center; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background); transform-origin: 0 0; flex: none; }

/* sky */

#skyDawn { background: linear-gradient(#fbf1e6 0%, #f8dcc6 55%, #f4b893 100%); }
#skyDay { background: linear-gradient(#fbf6ee 0%, #f8ecd2 55%, #f6d9a0 100%); opacity: 0; }
#skyDusk { background: linear-gradient(#f9e2c8 0%, #f5b98d 52%, #ee8a66 100%); opacity: 0; }
#sun { width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(#ffe2a8 0 18%, rgba(255,214,150,.55) 30%, rgba(255,214,150,0) 70%); }

/* camera */
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
#warm { background: #f08a5a; mix-blend-mode: multiply; opacity: 0; }

/* Odile (classes and origins as in app/globals.css "Odile motion") */
.odile { position: absolute; left: 0; top: 0; width: 400px; height: 400px; transform-origin: 160px 384px; pointer-events: none; }

.stork-head { transform-box: view-box; transform-origin: 82px 70px; }
.stork-eye { transform-box: fill-box; transform-origin: center; }
.stork-wing { transform-box: view-box; transform-origin: 62px 72px; }
.stork-bob, .stork-legs-a, .stork-legs-b, .stork-zzz { transform-box: view-box; transform-origin: 64px 140px; }
.odile-fx-bit { transform-box: fill-box; transform-origin: center; opacity: 0; }
.mini { position: absolute; left: 0; top: 0; width: 70px; height: 70px; }

/* text */

.notif { left: 1250px; top: 150px; width: 560px; padding: 22px 26px; border-radius: 30px; background: rgba(255,255,255,.96); box-shadow: 0 20px 50px rgba(58,42,32,.22); display: flex; gap: 18px; align-items: center; opacity: 0; }

.nav { position: absolute; left: 0; top: 739px; width: 390px; height: 64px; border-top: 1px solid var(--border); background: var(--surface); display: grid; grid-template-columns: repeat(6, 1fr); }

.tab .badge { position: absolute; right: 2px; top: 3px; min-width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: #2b2118; font-size: 11px; font-weight: 900; line-height: 20px; text-align: center; padding: 0 6px; }
#pill { position: absolute; top: 9px; left: 0; width: 56px; height: 32px; border-radius: 99px; background: var(--primary); }
.paper { width: 120px; height: 150px; border-radius: 12px; background: #fff; border: 3px solid #3a2a20; box-shadow: 0 16px 30px rgba(58,42,32,.25); opacity: 0; overflow: hidden; }
.paper .hd { height: 34px; background: var(--primary); color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; padding: 0 12px; letter-spacing: .06em; }
.paper .ln { height: 8px; border-radius: 4px; background: #e6dccd; margin: 12px 12px 0; }
#endcard { left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
#endglow { position: absolute; left: 560px; top: 470px; width: 1400px; height: 900px; margin: -450px 0 0 -700px; border-radius: 50%; background: radial-gradient(rgba(251,246,238,.97) 0 45%, rgba(251,246,238,0) 70%); }
#wordmark { position: absolute; left: 120px; top: 250px; font-weight: 900; font-size: 230px; letter-spacing: -.03em; color: var(--primary); line-height: 1; }
#tagline { position: absolute; left: 132px; top: 510px; font-weight: 900; font-size: 64px; }
#tagline2 { position: absolute; left: 134px; top: 600px; font-weight: 800; font-size: 34px; color: var(--muted); }
#ui { position: fixed; left: 12px; bottom: 12px; color: #f4ebdd; font: 700 13px/1.4 system-ui; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; }
#ui button { font: inherit; padding: 2px 10px; margin-right: 8px; }
.capture #ui { display: none; }
</style>
<script src="timeline.js"></script>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="sky" id="skyDawn"></div><div class="sky" id="skyDay"></div><div class="sky" id="skyDusk"></div>
  <div class="abs" id="sun"></div>
  <div class="cam" id="cam"></div>
  <div class="layer" id="warm"></div>
  <div class="layer" id="flock"></div>
  <div class="abs" id="readiness">
    <div class="row"><span>Trip readiness</span><b id="readyPct">0%</b></div>

</div></div>

<script>
"use strict";
const TL = window.TL, S = TL.scene, V = TL.vo, DUR = TL.duration, FPS = 30;
const $ = (id) => document.getElementById(id);
const html = (s) => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; };
const updaters = [];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const easeIO = (u) => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeOut = (u) => 1 - Math.pow(1 - u, 3);
const easeIn = (u) => u * u * u;
const ODILE_EASE = "cubic-bezier(.3,.7,.4,1)", ODILE_IO = "cubic-bezier(.45,0,.55,1)";

/* ---------- animation core: everything is a paused WAAPI animation seeked by one clock ---------- */
function anim(el, frames, start, dur, o = {}) {
  if (!el) return;
  const els = el instanceof Element ? [el] : [...el];
  for (const e of els) {
    const a = e.animate(frames, { duration: Math.max(1, dur * 1000), delay: start * 1000, fill: o.fill ?? "forwards", easing: o.easing ?? "linear", iterations: o.iter ?? 1, direction: o.dir ?? "normal" });
    a.pause();
  }
}
const set = (el, props, t) => anim(el, [props, props], t, 0.001);          // a hold from t on
const tween = (el, from, to, t, d, easing = "ease-in-out") => anim(el, [from, to], t, d, { easing });
/** Parse CSS @keyframes body text (copied from app/globals.css) into WAAPI frames. */
function kf(css, easing) {
  const out = [];
  const re = /([\d.%,\s]+|from|to)\s*\{([^}]*)\}/g; let m;
  while ((m = re.exec(css))) {
    const props = {};
    m[2].split(";").forEach((d) => { const i = d.indexOf(":"); if (i > 0) props[d.slice(0, i).trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = d.slice(i + 1).trim(); });
    m[1].split(",").map((s) => s.trim()).filter(Boolean).forEach((sel) => {
      const off = sel === "from" ? 0 : sel === "to" ? 1 : parseFloat(sel) / 100;
      out.push({ offset: off, ...props, ...(easing ? { easing } : {}) });
    });
  }
  out.sort((a, b) => a.offset - b.offset);
  if (out[0].offset !== 0) out.unshift({ offset: 0, transform: "none" });
  if (out[out.length - 1].offset !== 1) out.push({ offset: 1, transform: "none" });
  return out;
}

/* keyframes from app/globals.css ("Odile motion"), verbatim */
const K = {
  bob: "0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); }",
  blink: "0%, 40%, 100% { transform: scaleY(1); } 20%, 60% { transform: scaleY(.1); } 80% { transform: scaleY(1); }",
  tilt: "0%, 100% { transform: rotate(0); } 20%, 75% { transform: rotate(-12deg); }",
  peck: "0%, 100% { transform: rotate(0); } 25%, 55% { transform: rotate(16deg); } 40% { transform: rotate(5deg); } 75% { transform: rotate(-2deg); }",
  wingRuffle: "0%, 100% { transform: rotate(0); } 25%, 55% { transform: rotate(-10deg); }",
  hop: "0%, 100% { transform: none; } 18% { transform: translateY(2px) scale(1.04, .95); } 45% { transform: translateY(-11px); } 72% { transform: translateY(1px) scale(1.03, .97); }",
  look: "0%, 100% { transform: scaleX(1); } 14%, 70% { transform: scaleX(-1); } 84% { transform: scaleX(1); }",
  zzz: "0% { opacity: 0; transform: translate(0, 8px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -6px); }",
  jump: "0% { transform: none; } 14% { transform: scale(1.08, .9); } 40% { transform: translateY(-30%) scale(.96, 1.05); } 60% { transform: translateY(-30%); } 82% { transform: scale(1.07, .92); } 100% { transform: none; }",
  twirl: "0% { transform: none; } 15% { transform: translateY(-10%); } 50% { transform: translateY(-14%) rotateY(180deg); } 85% { transform: translateY(-4%) rotateY(360deg); } 100% { transform: rotateY(360deg); }",
  bounce: "0%, 100% { transform: none; } 12% { transform: scale(1.06, .92); } 26% { transform: translateY(-20%); } 42% { transform: translateY(0) scale(1.04, .95); } 56% { transform: translateY(-11%); } 70% { transform: none; } 82% { transform: translateY(-4%); } 92% { transform: none; }",
  leanBack: "0%, 100% { transform: none; } 20%, 75% { transform: rotate(-5deg) scale(1.03); }",
  salute: "0%, 100% { transform: rotate(0); } 22%, 72% { transform: rotate(-64deg); } 47% { transform: rotate(-56deg); }",
  dance: "0%, 100% { transform: none; } 12.5% { transform: translateX(-6%) rotate(-7deg); } 25%, 75% { transform: translateY(-7%); } 37.5% { transform: translateX(6%) rotate(7deg); } 50% { transform: none; } 62.5% { transform: translateX(-6%) rotate(-7deg); } 87.5% { transform: translateX(6%) rotate(7deg); }",
  swoon: "0%, 100% { transform: none; } 25%, 70% { transform: scale(1.06) rotate(-3deg); } 48% { transform: scale(1.04) rotate(-1deg); }",
  flap: "from { transform: rotate(8deg); } to { transform: rotate(-36deg); }",
  shrug: "0%, 100% { transform: none; } 20% { transform: translateY(-5%); } 36% { transform: translateY(1%); } 52% { transform: translateY(-4%); } 68% { transform: none; }",
  droop: "0%, 100% { transform: rotate(0); } 25%, 80% { transform: rotate(12deg); }",
  victory: "0%, 54%, 100% { transform: none; } 8%, 62% { transform: scale(1.08, .9); } 22%, 34% { transform: translateY(-34%); } 46%, 90% { transform: scale(1.05, .94); } 76% { transform: translateY(-26%) rotate(-6deg); }",
  loop: "0% { transform: none; } 15% { transform: translateY(-12%); } 70% { transform: translateY(-12%) rotate(-360deg); } 86% { transform: translateY(-3%) rotate(-360deg); } 100% { transform: rotate(-360deg); }",
  wave: "0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-52deg); } 40%, 80% { transform: rotate(-30deg); }",
  legsOut: "0%, 12%, 88%, 100% { opacity: 1; } 16%, 84% { opacity: 0; }",
  legsIn: "0%, 12%, 88%, 100% { opacity: 0; } 16%, 84% { opacity: 1; }",
  twinkle: "0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: scale(.6) rotate(45deg); }",
  rise: "0% { opacity: 0; transform: translateY(6px) scale(.6); } 25% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-24px); }",
  drip: "0% { opacity: 0; transform: translateY(-4px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(16px); }",
  burst: "0% { opacity: 0; transform: translateY(40px) scale(.5); } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px) rotate(170deg); }",
};
/* durations from lib/odile-motion.ts REACTIONS */
const REACTIONS = {
  jump: { ms: 900, mood: "cheer" }, twirl: { ms: 850, mood: "happy", fx: "sparkle" }, bounce: { ms: 950, mood: "cheer", fx: "sparkle" },
  salute: { ms: 1000, mood: "happy" }, dance: { ms: 1100, mood: "cheer" }, hearts: { ms: 1100, mood: "happy", fx: "hearts" },
  shrug: { ms: 1000, mood: "oops", fx: "sweat" }, victory: { ms: 1800, mood: "cheer", fx: "confetti" },
  loop: { ms: 1700, mood: "fly", fx: "sparkle" }, wave: { ms: 700, mood: "happy" },
};

/* ---------- Odile's drawing, ported from components/art/Stork.tsx ---------- */
const LINE = "#3a2a20", WHITE = "#ffffff", BLACK = "#2b2118", BEAK = "#e8532b", LEG = "#e0553a", GOLD = "#f0a04b", BLUE = "#6ab0e8", PINK = "#e8607a";
const HEAD_TILT = { happy: 0, cheer: -4, sulk: 20, sleepy: 26, think: -10, oops: 8, dizzy: 12, fly: 34 };
const WING_LIFT = { happy: 0, cheer: -38, sulk: 6, sleepy: 4, think: 0, oops: -14, dizzy: 4, fly: -46 };
const STAR = "M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z";
const HEART = "M0 4 C-7 -2 -4 -9 0 -4.5 C4 -9 7 -2 0 4 Z";
const LEGP = `stroke="${LEG}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"`;

/* ---------- Odile actor: mover (path) > body (reactions) > one svg per mood ---------- */
const MOODS = ["happy", "cheer", "sleepy", "think", "oops", "fly"];
function makeOdile(parent, mood0) {
  const mover = html(`<div class="odile"><div class="odile-body"></div></div>`);
  const body = mover.firstElementChild;
  const layers = {};
  for (const m of MOODS) { const el = html(storkSVG(m)); el.style.opacity = m === mood0 ? 1 : 0; body.appendChild(el); layers[m] = el; }
  const fx = html(fxSVG()); body.appendChild(fx);
  parent.appendChild(mover);
  const all = (sel) => body.querySelectorAll(sel);
  const O = { mover, body, layers, cur: mood0 };
  O.mood = (m, t) => { for (const k of MOODS) set(layers[k], { opacity: k === m ? 1 : 0 }, t); };
  O.flap = (t, d, period = 0.17) => anim(all(".stork-wing"), kf(K.flap), t, period, { iter: Math.max(2, Math.round(d / period)), dir: "alternate", easing: "ease-in-out", fill: "none" });
  O.part = (sel, k, t, d, easing = ODILE_EASE) => anim(all(sel), kf(K[k], easing), t, d, { fill: "none" });
  O.fx = (name, t, d) => {
    all(`.fx-${name} .odile-fx-bit`).forEach((b) => {
      const i = +b.dataset.i, k = { sparkle: "twinkle", hearts: "rise", sweat: "drip", confetti: "burst" }[name];
      anim(b, kf(K[k], name === "sweat" ? "ease-in" : ODILE_EASE), t + i * (name === "confetti" ? .07 : .12), d, { fill: "none" });
    });
  };
  /** One reaction from the app's vocabulary. Mood shows for its length, then `after`. */
  O.react = (name, t, after = "happy", ms) => {
    const spec = REACTIONS[name]; const d = (ms ?? spec.ms) / 1000;
    O.mood(spec.mood, t); O.mood(after, t + d);
    const bodyK = { jump: "jump", twirl: "twirl", bounce: "bounce", salute: "leanBack", dance: "dance", hearts: "swoon", shrug: "shrug", victory: "victory", loop: "loop" }[name];
    if (bodyK) { let fr = kf(K[bodyK], name === "dance" || name === "loop" ? ODILE_IO : ODILE_EASE); if (name === "loop") fr = fr.map((f) => ({ ...f, transformOrigin: "50% 45%" })); anim(body, fr, t, d, { fill: "none" }); }
    if (["jump", "bounce", "victory", "loop"].includes(name)) O.flap(t, d);
    if (name === "salute") { O.part(".stork-wing", "salute", t, d); O.part(".stork-head", "tilt", t, d); }
    if (name === "hearts") O.part(".stork-head", "tilt", t, d, ODILE_IO);
    if (name === "shrug") { O.part(".stork-wing", "wingRuffle", t, d); O.part(".stork-head", "droop", t, d); }
    if (name === "wave") O.part(".stork-wing", "wave", t, d, ODILE_IO);
    if (name === "dance") { anim(all(".stork-legs-a"), kf(K.legsOut), t, d / 2, { iter: 2, fill: "none" }); anim(all(".stork-legs-b"), kf(K.legsIn), t, d / 2, { iter: 2, fill: "none" }); }
    if (spec.fx) O.fx(spec.fx, t, d);
  };
  O.idle = (name, t, d) => {
    if (name === "blink") O.part(".stork-eye", "blink", t, d ?? .45, "linear");
    if (name === "tilt") O.part(".stork-head", "tilt", t, d ?? 1.5, ODILE_IO);
    if (name === "peck") O.part(".stork-head", "peck", t, d ?? .9, ODILE_IO);
    if (name === "hop") O.part(".stork-bob", "hop", t, d ?? .6);
    if (name === "look") O.part(".stork-bob", "look", t, d ?? 1.7, ODILE_IO);
    if (name === "ruffle") O.part(".stork-wing", "wingRuffle", t, d ?? .7, ODILE_IO);
  };
  /** Place her feet at (x, y). s = size / 400px, f = facing (1 right, -1 left), r = tilt in degrees. */
  const tf = (p) => `translate(${p.x - 160}px, ${p.y - 384}px) scale(${p.s * (p.f ?? 1)}, ${p.s}) rotate(${p.r ?? 0}deg)`;
  O.place = (p) => { mover.style.transform = tf(p); O.at = p; };
  O.path = (fn, t, d) => {
    const n = Math.max(2, Math.round(d * FPS)), frames = [];
    for (let i = 0; i <= n; i++) frames.push({ transform: tf(fn(i / n)) });
    anim(mover, frames, t, d); O.at = fn(1);
  };
  /** A hop from where she is to (x, y): arc of height h, facing the way she goes, squash on landing. */
  O.hop = (x, y, t, d, h, s) => {
    const a = { ...O.at }, s1 = s ?? a.s, f = x < a.x ? -1 : 1;

    O.flap(t, d, .13); O.land(t + d);
  };
  O.land = (t) => anim(body, [{ transform: "scale(1.12, .84)", easing: ODILE_EASE }, { transform: "none" }], t, .35, { fill: "none" });
  O.breathe = () => anim(all(".stork-bob"), kf(K.bob, "ease-in-out"), 0, 3.2, { iter: Infinity, fill: "none" });
  return O;
}

// Scene 7: end card. Odile + "Le Nid", like the app's Logo component.
const EC = $("endcard");
tween(EC, { opacity: 0 }, { opacity: 1 }, S.landEnd - .4, .7, "ease-out");
const wm = $("wordmark");
anim(wm, [{ opacity: 0, transform: "translateY(40px) scale(.8)" }, { opacity: 1, transform: "translateY(-6px) scale(1.03)", offset: .7 }, { opacity: 1, transform: "none" }], S.logo, .6, { easing: "ease-out", fill: "both" });
anim($("tagline"), [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }], S.logo + .5, .5, { easing: "ease-out", fill: "both" });
anim($("tagline2"), [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }], S.logo + .8, .5, { easing: "ease-out", fill: "both" });
tween($("headlines"), { opacity: 1 }, { opacity: 0 }, S.landEnd, .3);

/* ---------- clock ---------- */
function seek(t) {
  const ms = t * 1000;
  for (const a of document.getAnimations()) a.currentTime = ms;
  for (const u of updaters) u(t);
}
window.seek = seek;
window.DURATION = DUR;

const params = new URLSearchParams(location.search);
if (params.has("capture")) document.documentElement.classList.add("capture");
function fit() {
  const s = params.has("capture") ? 1 : Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s})`; stage.parentElement.style.width = 1920 * s + "px"; stage.parentElement.style.height = 1080 * s + "px";
  stage.parentElement.style.position = "relative"; stage.parentElement.style.margin = `${(innerHeight - 1080 * s) / 2}px auto 0`;
}
addEventListener("resize", fit); fit();

let now = +(params.get("t") || 0), playing = false, last = 0;
const audio = new Audio("audio/le-nid-mix.m4a");
const clockEl = $("clock"), playBtn = $("play");
function show() { seek(now); clockEl.textContent = now.toFixed(2) + " s"; }
function frame(ts) { if (!playing) return; now = audio.duration && !audio.paused ? audio.currentTime : now + (ts - last) / 1000; last = ts; if (now >= DUR) { now = DUR; playing = false; audio.pause(); playBtn.textContent = "Play"; } show(); requestAnimationFrame(frame); }
function toggle() {
  playing = !playing; playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) { if (now >= DUR) now = 0; audio.currentTime = now; audio.play().catch(() => {}); last = performance.now(); requestAnimationFrame(frame); } else audio.pause();
}
playBtn.onclick = toggle;
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight" || e.code === "ArrowLeft") { now = clamp(now + (e.code === "ArrowRight" ? 1 : -1) * (e.shiftKey ? .1 : 1), 0, DUR); audio.currentTime = now; show(); }
});
show();
window.READY = document.fonts.ready.then(() => true);
</script>
